name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv for Python tooling
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install pinned formatters
        run: sh scripts/format-go.sh --install
      - name: Check Go formatting
        run: sh scripts/format-go.sh --check
      - name: Vet
        run: go vet ./...
      - name: Check known Go vulnerabilities
        run: sh scripts/check-go-vulnerabilities.sh
      - name: Test with race detector
        run: go test -race ./...
