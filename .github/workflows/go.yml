name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned formatters
        run: sh scripts/format-go.sh --install
      - name: Check Go formatting
        run: sh scripts/format-go.sh --check
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
