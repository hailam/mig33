name: Mobile compatibility client

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check generated client contracts
        run: sh scripts/generate-contracts.sh --check
      - name: Build isolated compatibility server
        run: go build -o data/mobile-integration/server ./cmd/omni
      - name: Install scoped mobile tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          working_directory: apps/mobile
          install_args: node pnpm
          minimum_release_age: 3d
      - name: Install locked app dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Check policy, types, fixtures, sessions and both live transports
        env:
          MIG33_TEST_SERVER_BINARY: ${{ github.workspace }}/data/mobile-integration/server
        run: pnpm --dir apps/mobile run check
      - name: Export iOS JavaScript and Hermes bundle
        run: pnpm --dir apps/mobile run export:ios
