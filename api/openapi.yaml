---
openapi: 3.0.3
info:
  title: mig33 reconstruction HTTP contract
  version: 1.0.0
  description: Current local mig33 4.62 reconstruction HTTP surface. Modern JSON endpoints
    are reconstruction extensions, not recovered historical URLs. Legacy pages retain
    their real query-based URLs. TCP packet opcodes remain in protocol documentation.
    Public URLs and listen addresses are configurable; this contract does not imply
    real SMS/email/payment providers. Generated HTTP DTOs belong only to the transport
    adapter.
  license:
    name: Project-local reconstruction documentation
servers:
- url: http://127.0.0.1:8080
  description: Default local HTTP endpoint; override for your configured public URL.
tags:
- name: modern-json
  description: Typed reconstruction JSON endpoints; selected for Go HTTP adapter generation.
- name: media
  description: Raw uploads and authorized image resources.
- name: resources
  description: Original applet resources.
- name: legacy-pages
  description: Historical query-selector HTML page envelope.
- name: browser
  description: WAP browser interface.
- name: operator
  description: Allowlisted local operator browser interface.
- name: native-gateway
  description: Original binary protocol over HTTP; TCP is documented separately.
paths:
  "/healthz":
    get:
      operationId: ReadHealth
      summary: Read local backend health
      tags:
      - modern-json
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        default:
          "$ref": "#/components/responses/TextError"
  "/api/catalog":
    get:
      operationId: GetCatalog
      summary: Read static reconstruction catalog
      tags:
      - modern-json
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Catalog"
        default:
          "$ref": "#/components/responses/TextError"
      description: Public metadata only. All query parameters are rejected. Product
        evidence distinguishes historical names from local pricing/artwork.
  "/api/contacts":
    get:
      operationId: GetContacts
      summary: Read authoritative contact snapshot
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Contacts"
        default:
          "$ref": "#/components/responses/TextError"
  "/api/chat/session":
    get:
      operationId: GetChatSession
      summary: Read current session metadata
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChatSession"
        default:
          "$ref": "#/components/responses/TextError"
      description: Requires an already authenticated sid header. This does not log
        in or create a session; native protocol and WAP login are separate flows.
  "/api/chat/sync":
    get:
      operationId: SyncChat
      summary: Read authorized transcript after a cursor
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagePage"
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/AfterID"
      - "$ref": "#/components/parameters/Limit"
  "/api/chat/history":
    get:
      operationId: GetChatHistory
      summary: Read one conversation history
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HistoryPage"
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/Kind"
      - "$ref": "#/components/parameters/Target"
      - "$ref": "#/components/parameters/AfterID"
      - "$ref": "#/components/parameters/Limit"
      description: Room history requires this session to be currently joined. Private/group
        historical access follows stored audience grants. Response message.kind is
        numeric although request kind is textual.
  "/api/chat/groups":
    get:
      operationId: GetChatGroups
      summary: Read private group conversations
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChatGroups"
        default:
          "$ref": "#/components/responses/TextError"
      description: These are private chat groups, distinct from public rooms and community
        Groups.
  "/api/chat/messages":
    post:
      operationId: SendMessage
      summary: Send an idempotent chat message
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '201':
          description: New message saved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResult"
        '200':
          description: Existing message returned for matching retry
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResult"
        '409':
          "$ref": "#/components/responses/TextError"
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/CSRF"
      - "$ref": "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MessageInput"
        description: One JSON object, at most 96 KiB.
  "/api/chat/read":
    post:
      operationId: MarkChatRead
      summary: Advance a conversation read position
      tags:
      - modern-json
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReadPosition"
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReadInput"
  "/api/photos":
    post:
      operationId: UploadPhoto
      summary: Upload a local photo
      tags:
      - media
      security:
      - SessionHeader: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoResult"
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - "$ref": "#/components/parameters/CSRF"
      - "$ref": "#/components/parameters/Idempotency"
      - name: caption
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: Raw PNG/JPEG bytes, not multipart; at most 1 MiB. Image contents
          are validated, regardless of Content-Type.
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      description: Successful retries return the saved photo with 201. Upload and
        media errors may be HTML or plain text.
  "/assets/photos/{id}":
    get:
      operationId: GetPhoto
      summary: Read an authorized photo or preview
      tags:
      - media
      security:
      - SessionHeader: []
      - WAPCookie: []
      responses:
        '200':
          description: Original image or PNG preview when w is supplied
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: w
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 240
  "/sites/resources/language/v4.6/l":
    get:
      operationId: GetLanguageCatalog
      summary: Protocol 1002 frame describing the English resource
      tags:
      - resources
      security: []
      responses:
        '200':
          description: Protocol 1002 frame describing the English resource
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
  "/sites/resources/language/v4.6/en-US":
    get:
      operationId: GetEnglishLanguage
      summary: Original English language resource bytes
      tags:
      - resources
      security: []
      responses:
        '200':
          description: Original English language resource bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
  "/sites/index.php":
    x-legacy-routes:
      catalog: "../internal/pages/routes.json"
      catalogKind: historical-recognition
      selectorParameters:
      - c
      - a
      - v
      implementation: "../internal/services/page_routes.go"
      dispatch: "../internal/services/application.go#pageForm"
      publicSelectors:
      - c: registration_api
        a: check_username
        v: midlet
      - c: registration
        a: home
        v: midlet
      - c: account
        a: recover
        v: midlet
      formDocumentation:
      - "../docs/service-pages.md"
      - "../docs/identity.md"
      - "../docs/community-commerce.md"
      - "../docs/room-completion.md"
    get:
      operationId: GetLegacyPage
      summary: Read a historical embedded page
      tags:
      - legacy-pages
      security:
      - {}
      - SessionHeader: []
      - WAPCookie: []
      responses:
        '200':
          description: Selected page or public username check
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - "$ref": "#/components/parameters/Controller"
      - "$ref": "#/components/parameters/Action"
      - "$ref": "#/components/parameters/View"
      description: 'One actual URL is shared by all historical c/a/v variants. Public
        selectors: registration_api/check_username, registration/home, account/recover.
        All other pages require a session. Additional query and form fields depend
        on the selected page. The historical catalog declares recognition, not implementation.
        Unknown routes return 404 and catalogued but unavailable fallback routes may
        return 501. Opcode 922 calls the same page dispatcher directly and wraps its
        response in opcode 923.'
    post:
      operationId: SubmitLegacyPage
      summary: Submit a historical embedded-page form
      tags:
      - legacy-pages
      security:
      - {}
      - SessionHeader: []
      - WAPCookie: []
      responses:
        '200':
          description: Selected page or public username check
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - "$ref": "#/components/parameters/Controller"
      - "$ref": "#/components/parameters/Action"
      - "$ref": "#/components/parameters/View"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/LegacyForm"
        description: At most 8192 bytes. Browser form encoding applies; native packet922
          uses its own compatibility decoder.
      description: 'One actual URL is shared by all historical c/a/v variants. Public
        selectors: registration_api/check_username, registration/home, account/recover.
        All other pages require a session. Additional query and form fields depend
        on the selected page. The historical catalog declares recognition, not implementation.
        Unknown routes return 404 and catalogued but unavailable fallback routes may
        return 501. Opcode 922 calls the same page dispatcher directly and wraps its
        response in opcode 923. Mutations generally require the session csrf and route-specific
        nonce/binding fields.'
  "/member2/t.php":
    get:
      operationId: GetWAPChat
      summary: Read WAP login, directory or conversation
      tags:
      - browser
      security:
      - {}
      - SessionHeader: []
      - WAPCookie: []
      responses:
        '200':
          description: HTML login/directory/chat
          content:
            text/html:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - private
          - group
          - room
      - name: target
        in: query
        required: false
        schema:
          type: string
      - "$ref": "#/components/parameters/AfterID"
      description: Unauthenticated GET sets mig33_wap_login for the subsequent login
        form. Authenticated conversation requests use kind and target; directory requires
        no query parameters.
    post:
      operationId: SubmitWAPChat
      summary: Log in or submit a WAP chat action
      tags:
      - browser
      security:
      - {}
      - SessionHeader: []
      - WAPCookie: []
      responses:
        '200':
          description: HTML chat result
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - private
          - group
          - room
      - name: target
        in: query
        required: false
        schema:
          type: string
      - "$ref": "#/components/parameters/AfterID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/WAPForm"
      description: At most 32 KiB. Login requires mig33_wap_login cookie matching
        form csrf. Other operations use session csrf. Origin, when supplied, must
        equal configured public URL. Forms reject duplicate fields. Browser sessions
        use mig33_wap; native SID is also supported.
  "/operator":
    get:
      operationId: GetOperatorDashboard
      summary: Read operator queues or item details
      tags:
      - operator
      security:
      - SessionHeader: []
      - OperatorCookie: []
      responses:
        '200':
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - report
          - support
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: report_before
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: support_before
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      description: Disabled with 404 unless operators are configured. Requires an
        allowlisted account. Missing session redirects GET requests to /operator/login.
  "/operator/":
    get:
      operationId: GetOperatorDashboardSlash
      summary: Read operator queues or item details
      tags:
      - operator
      security:
      - SessionHeader: []
      - OperatorCookie: []
      responses:
        '200':
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - report
          - support
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: report_before
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: support_before
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      description: Disabled with 404 unless operators are configured. Requires an
        allowlisted account. Missing session redirects GET requests to /operator/login.
  "/operator/login":
    get:
      operationId: GetOperatorLogin
      summary: Read operator login form
      tags:
      - operator
      security: []
      responses:
        '200':
          description: Login form; sets mig33_operator_login CSRF cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/TextError"
    post:
      operationId: LoginOperator
      summary: Create an operator browser session
      tags:
      - operator
      security: []
      responses:
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/TextError"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/OperatorLogin"
      description: Requires mig33_operator_login cookie matching form csrf and an
        allowlisted existing account. Successful login sets mig33_operator. Disabled
        with 404 when no operators are configured.
  "/operator/logout":
    post:
      operationId: LogoutOperator
      summary: End operator session
      tags:
      - operator
      security:
      - SessionHeader: []
      - OperatorCookie: []
      responses:
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/CSRFForm"
      description: Requires session csrf in the form. Forms are limited to 8192 bytes,
        reject duplicate fields and require matching Origin when supplied.
  "/operator/review":
    post:
      operationId: ReviewOperatorItem
      summary: Review a report or support item
      tags:
      - operator
      security:
      - SessionHeader: []
      - OperatorCookie: []
      responses:
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/OperatorReview"
      description: Requires session csrf in the form. Forms are limited to 8192 bytes,
        reject duplicate fields and require matching Origin when supplied.
  "/operator/categories":
    post:
      operationId: ManageRoomCategories
      summary: Create, update, delete or assign room categories
      tags:
      - operator
      security:
      - SessionHeader: []
      - OperatorCookie: []
      responses:
        '303':
          description: Redirect after successful action
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: One or more session/login-CSRF cookie headers may be emitted.
        default:
          "$ref": "#/components/responses/MixedError"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/OperatorCategory"
      description: Requires session csrf in the form. Forms are limited to 8192 bytes,
        reject duplicate fields and require matching Origin when supplied.
  "/":
    get:
      operationId: PollNativeRoot
      summary: Poll native packet delivery
      tags:
      - native-gateway
      security:
      - SessionHeader: []
      responses:
        '200':
          description: Zero or more native packets
          content:
            image/gif:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/OptionalSID"
      description: Original binary packet tunnel. The response MIME is historically
        image/gif although bytes are NOT a GIF. POST contains one or more native framed
        packets; errors within valid protocol packets normally remain HTTP 200 and
        use protocol opcode 0. GET drains queued packets immediately and may return
        an empty body. Authentication and registration are protocol operations. TCP
        9119 uses the same packet codec and is documented separately, outside OpenAPI.
        GET requires an authenticated session from the path or sid header.
    post:
      operationId: PostNativeRoot
      summary: Submit native binary packets
      tags:
      - native-gateway
      security: []
      responses:
        '200':
          description: Native replies and queued delivery frames
          content:
            image/gif:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/OptionalSID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: The implementation does not enforce request Content-Type. Maximum
          body size equals protocol.MaxFrameSize.
      description: Original binary packet tunnel. The response MIME is historically
        image/gif although bytes are NOT a GIF. POST contains one or more native framed
        packets; errors within valid protocol packets normally remain HTTP 200 and
        use protocol opcode 0. GET drains queued packets immediately and may return
        an empty body. Authentication and registration are protocol operations. TCP
        9119 uses the same packet codec and is documented separately, outside OpenAPI.
  "/{sid}":
    get:
      operationId: PollNativeSession
      summary: Poll native packet delivery
      tags:
      - native-gateway
      security: []
      responses:
        '200':
          description: Zero or more native packets
          content:
            image/gif:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/SIDPath"
      - "$ref": "#/components/parameters/OptionalSID"
      description: Original binary packet tunnel. The response MIME is historically
        image/gif although bytes are NOT a GIF. POST contains one or more native framed
        packets; errors within valid protocol packets normally remain HTTP 200 and
        use protocol opcode 0. GET drains queued packets immediately and may return
        an empty body. Authentication and registration are protocol operations. TCP
        9119 uses the same packet codec and is documented separately, outside OpenAPI.
        GET requires an authenticated session from the path or sid header.
    post:
      operationId: PostNativeSession
      summary: Submit native binary packets
      tags:
      - native-gateway
      security: []
      responses:
        '200':
          description: Native replies and queued delivery frames
          content:
            image/gif:
              schema:
                type: string
                format: binary
        default:
          "$ref": "#/components/responses/TextError"
      parameters:
      - "$ref": "#/components/parameters/SIDPath"
      - "$ref": "#/components/parameters/OptionalSID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: The implementation does not enforce request Content-Type. Maximum
          body size equals protocol.MaxFrameSize.
      description: Original binary packet tunnel. The response MIME is historically
        image/gif although bytes are NOT a GIF. POST contains one or more native framed
        packets; errors within valid protocol packets normally remain HTTP 200 and
        use protocol opcode 0. GET drains queued packets immediately and may return
        an empty body. Authentication and registration are protocol operations. TCP
        9119 uses the same packet codec and is documented separately, outside OpenAPI.
components:
  securitySchemes:
    SessionHeader:
      type: apiKey
      in: header
      name: sid
      description: Existing authenticated gateway session token. Obtain via native
        protocol login; GET /api/chat/session only reads metadata.
    WAPCookie:
      type: apiKey
      in: cookie
      name: mig33_wap
      description: Browser session created by WAP form login.
    OperatorCookie:
      type: apiKey
      in: cookie
      name: mig33_operator
      description: Allowlisted operator session created by /operator/login.
  parameters:
    AfterID:
      name: after_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
        default: 50
    Kind:
      name: kind
      in: query
      required: true
      schema:
        "$ref": "#/components/schemas/ConversationKind"
    Target:
      name: target
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
